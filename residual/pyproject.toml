[project]
name = "residual"
version = "0.1.0"
description = "Domain-neutral residual accounting: provenance-typed claims, evidence labels, gap-map fields."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/residual"]

[tool.pytest.ini_options]
testpaths = ["tests"]
